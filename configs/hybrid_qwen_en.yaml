# Hybrid OCR + local Gemma Persian GGUF translation
#
# Local weights (no Hub download for these):
#   OCR:         D:/projects/models/Qwen3-VL-8B-Instruct
#   Translation: models/gemma-3-4b-persian-gguf/*.gguf
#
# Setup:
#   pip install ultralytics huggingface_hub llama-cpp-python
#   pip install -U 'transformers>=4.57.0' accelerate bitsandbytes qwen-vl-utils
#   python scripts/download_comic_yolo.py --variant textseg
#
# Note: unload_after_stage frees VRAM between Qwen OCR and Gemma translate.

pipeline:
  version: "0.1.0"
  source_language: "en"
  target_language: "fa"
  force: true

preprocessing:
  convert_to_rgb: true
  max_dimension: 1600
  validate: true

detection:
  backend: "yolo_comic"
  model: "models/comic-yolo.pt"
  variant: "textseg"
  confidence_threshold: 0.25
  imgsz: 1024

ocr:
  backend: "hybrid_qwen"
  model: "D:/projects/models/Qwen3-VL-8B-Instruct"
  local_files_only: true
  lang: "en"
  confidence_threshold: 0.3
  load_in_4bit: true
  max_new_tokens: 96
  pad_px: 6
  max_pixels: 3211264
  prompt: >
    Read all English text in this comic speech bubble or caption.
    Output only the transcribed text, nothing else.
    If there is no readable text, output an empty string.

translation:
  backend: "llama_cpp"
  model: "models/gemma-3-4b-persian-gguf"
  n_gpu_layers: -1
  n_ctx: 2048
  max_tokens: 256
  temperature: 0.1
  glossary:
    "Jennette": "جنت"
    "JENNETTE": "جنت"
    "Claude": "کلود"
    "CLAUDE": "کلود"
    "Your Highness": "علیاحضرت"
    "Princess": "شاهزاده"

masking:
  dilation_px: 16
  blur_radius: 2
  use_polygon: true
  residual_expand: true
  residual_thresh: 140

inpainting:
  backend: "opencv"
  tile_size: 768
  overlap: 64
  fallback_to_cpu: true

device:
  preferred: "cuda"
  device_id: 0
  unload_after_stage: true

cache:
  enabled: true

logging:
  level: "INFO"
  structured: true
