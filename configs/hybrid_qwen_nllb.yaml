# Hybrid OCR (local Qwen3-VL) + NLLB-200 translation  ==  ACCURATE MODE
#
# NLLB-200-distilled-1.3B is a dedicated translator: it never breaks character,
# never answers questions, never hallucinates filler. Faithful + reliable, and
# only ~2.8 GB VRAM on a 6 GB GPU. Downloads ~2.5 GB from HF on first run.
#
# Trade-off: a pure translator ignores style/few-shot prompts. For a funny /
# human / custom house voice, use the Gemma style config instead:
#   -c configs/hybrid_qwen_gemma_it.yaml
#
# OCR weights:  D:/projects/models/Qwen3-VL-8B-Instruct

pipeline:
  version: "0.1.0"
  source_language: "en"
  target_language: "fa"
  force: true

preprocessing:
  convert_to_rgb: true
  max_dimension: 1600
  validate: true

detection:
  backend: "yolo_comic"
  model: "models/comic-yolo.pt"
  variant: "textseg"
  confidence_threshold: 0.25
  imgsz: 1024

ocr:
  backend: "hybrid_qwen"
  model: "D:/projects/models/Qwen3-VL-8B-Instruct"
  local_files_only: true
  lang: "en"
  confidence_threshold: 0.3
  load_in_4bit: true
  max_new_tokens: 96
  pad_px: 6
  max_pixels: 3211264
  prompt: >
    Read all English text in this comic speech bubble or caption.
    Output only the transcribed text, nothing else.
    If there is no readable text, output an empty string.

translation:
  backend: "huggingface"
  model: "facebook/nllb-200-distilled-1.3B"   # dedicated EN->FA translator
  local_files_only: false                      # auto-downloads ~2.5 GB on first run
  max_new_tokens: 128
  max_length: 256
  batch_size: 8
  validate: true
  max_retries: 1
  unit: "region"
  output_format: "scanlation"
  glossary:
    "Jennette": "جنت"
    "JENNETTE": "جنت"
    "Claude": "کلود"
    "CLAUDE": "کلود"
    "Your Highness": "علیاحضرت"
    "Princess": "پرنسس"
    "PRINCESS": "پرنسس"

masking:
  dilation_px: 18
  blur_radius: 2
  use_polygon: true
  residual_expand: true
  residual_thresh: 140
  bubble_inflate: true
  bubble_pad_px: 10

inpainting:
  crop_margin: 128
  backend: "anime-lama"  # color anime/manga LaMa (vendored, no iopaint deps)
  tile_size: 768
  overlap: 64
  fallback_to_cpu: true

device:
  preferred: "cuda"
  device_id: 0
  unload_after_stage: true

cache:
  enabled: true

logging:
  level: "INFO"
  structured: true
