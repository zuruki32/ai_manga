# LOCAL: Korean manhwa → Persian
# Uses pivot: Korean → English → Persian (two small MarianMT models)
#
# pip install transformers sentencepiece sacremoses torch easyocr

pipeline:
  version: "0.1.0"
  source_language: "ko"
  target_language: "fa"
  force: false

preprocessing:
  convert_to_rgb: true
  max_dimension: 2048
  validate: true

detection:
  backend: "mock"
  confidence_threshold: 0.5

ocr:
  backend: "easyocr"
  languages: ["ko", "en"]
  confidence_threshold: 0.3

translation:
  backend: "huggingface"
  model: "Helsinki-NLP/opus-mt-en-fa"
  pivot_model: "Helsinki-NLP/opus-mt-ko-en"
  max_length: 256
  batch_size: 4
  glossary: {}

masking:
  dilation_px: 8
  blur_radius: 1
  use_polygon: true

inpainting:
  model: "manga"
  hd_strategy: "crop"
  crop_trigger_size: 1024
  crop_margin: 128
  resize_limit: 2048
  backend: "iopaint"  # manga-finetuned LaMa via IOPaint
  tile_size: 768
  overlap: 64
  precision: "fp16"
  fallback_to_cpu: true

device:
  preferred: "cuda"
  device_id: 0
  unload_after_stage: true

cache:
  enabled: true

logging:
  level: "INFO"
  structured: true
