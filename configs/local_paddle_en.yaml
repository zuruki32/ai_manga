# PaddleOCR detect+OCR (better EN) + residual full-text clean + M2M100 page FA
# RTX 2060 6GB — unload between stages

pipeline:
  version: "0.1.0"
  source_language: "en"
  target_language: "fa"
  force: true

preprocessing:
  convert_to_rgb: true
  max_dimension: 1600
  validate: true

detection:
  backend: "paddle"
  lang: "en"
  confidence_threshold: 0.45

ocr:
  backend: "paddle"
  lang: "en"
  confidence_threshold: 0.4

translation:
  backend: "huggingface"
  model: "models/m2m100-en2fa"
  batch_size: 4
  max_length: 256
  glossary:
    "Jennette": "جنت"
    "JENNETTE": "جنت"
    "Claude": "کلود"
    "CLAUDE": "کلود"
    "Your Highness": "علیاحضرت"
    "Princess": "شاهزاده"

masking:
  dilation_px: 16
  blur_radius: 2
  use_polygon: true
  residual_expand: true
  residual_thresh: 140

inpainting:
  backend: "opencv"
  tile_size: 768
  overlap: 64
  fallback_to_cpu: true

device:
  preferred: "cuda"
  device_id: 0
  unload_after_stage: true

cache:
  enabled: true

logging:
  level: "INFO"
  structured: true
