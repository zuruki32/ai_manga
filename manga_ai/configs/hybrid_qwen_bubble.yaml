# Hybrid: ogkalu bubble YOLO → Qwen3-VL OCR → Gemma Persian GGUF
# python scripts/download_comic_yolo.py --variant bubble

pipeline:
  version: "0.1.0"
  source_language: "en"
  target_language: "fa"
  force: true

preprocessing:
  convert_to_rgb: true
  max_dimension: 1600
  validate: true

detection:
  backend: "yolo_comic"
  model: "models/comic-bubble.pt"
  variant: "bubble"
  confidence_threshold: 0.25
  imgsz: 1024

ocr:
  backend: "hybrid_qwen"
  model: "D:/projects/models/Qwen3-VL-8B-Instruct"
  local_files_only: true
  lang: "en"
  load_in_4bit: true
  max_new_tokens: 96
  pad_px: 6

translation:
  backend: "llama_cpp"
  model: "models/gemma-3-4b-persian-gguf"
  n_gpu_layers: -1
  n_ctx: 2048
  max_tokens: 256
  temperature: 0.1
  glossary:
    "Jennette": "جنت"
    "JENNETTE": "جنت"
    "Claude": "کلود"
    "CLAUDE": "کلود"
    "Your Highness": "علیاحضرت"
    "Princess": "شاهزاده"

masking:
  dilation_px: 16
  blur_radius: 2
  use_polygon: true

inpainting:
  backend: "opencv"
  fallback_to_cpu: true

device:
  preferred: "cuda"
  device_id: 0
  unload_after_stage: true

cache:
  enabled: true

logging:
  level: "INFO"
  structured: true
