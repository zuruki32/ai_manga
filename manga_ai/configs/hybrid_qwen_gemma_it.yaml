# Hybrid OCR (local Qwen3-VL) + stock Gemma-3-4B-IT translation
#
# Local weights:
#   OCR:         D:/projects/models/Qwen3-VL-8B-Instruct
#   Translation: models/gemma-3-4b-it   (google/gemma-3-4b-it — NOT the Persian SFT)
#
# Why: the Persian SFT (mshojaei77) is a chat model and often invents filler /
# drops meaning. Stock Instruct + our colloquial prompt is usually more faithful.
#
# Download (HF account + accept Gemma license may be required):
#   hf auth login
#   python scripts/download_models.py --model gemma_it
#
# Compare with Persian SFT: -c configs/hybrid_qwen_en.yaml

pipeline:
  version: "0.1.0"
  source_language: "en"
  target_language: "fa"
  force: true

preprocessing:
  convert_to_rgb: true
  max_dimension: 1600
  validate: true

detection:
  backend: "yolo_comic"
  model: "models/comic-yolo.pt"
  variant: "textseg"
  confidence_threshold: 0.25
  imgsz: 1024

ocr:
  backend: "hybrid_qwen"
  model: "D:/projects/models/Qwen3-VL-8B-Instruct"
  local_files_only: true
  lang: "en"
  confidence_threshold: 0.3
  load_in_4bit: true
  max_new_tokens: 96
  pad_px: 6
  max_pixels: 3211264
  prompt: >
    Read all English text in this comic speech bubble or caption.
    Output only the transcribed text, nothing else.
    If there is no readable text, output an empty string.

translation:
  backend: "huggingface"
  model: "models/gemma-3-4b-it"
  local_files_only: true
  load_in_4bit: true
  max_new_tokens: 192
  max_length: 512
  batch_size: 1
  validate: true
  max_retries: 2
  # Stock Instruct + English "Persian-only" prompt (FA instructions make IT reply in EN).
  # No EN:/FA: few-shots. Persian SFT still uses the FA colloquial prompt.
  style: "colloquial_fa"
  # Neighbouring bubbles shown to the model as context (not translated)
  context_window: 1
  unit: "region"
  output_format: "scanlation"
  glossary:
    "Jennette": "جنت"
    "JENNETTE": "جنت"
    "Claude": "کلود"
    "CLAUDE": "کلود"
    "Your Highness": "علیاحضرت"
    "Princess": "پرنسس"
    "PRINCESS": "پرنسس"

masking:
  dilation_px: 18
  blur_radius: 2
  use_polygon: true
  residual_expand: true
  residual_thresh: 140
  bubble_inflate: true
  bubble_pad_px: 10

inpainting:
  # Best quality (same stack as manga-image-translator / PanelCleaner / manga-text-cleaner):
  #   pip install 'manga-ai[lama]'
  #   # or: pip install simple-lama-inpainting --no-deps
  # Auto-falls back to improved OpenCV if LaMa missing / OOM (no per-page hard fail).
  backend: "lama"
  radius: 7
  method: "telea"
  passes: 2
  soft_edge: 3
  bg_fill: true
  tile_size: 768
  overlap: 64
  fallback_to_cpu: true

device:
  preferred: "cuda"
  device_id: 0
  unload_after_stage: true

cache:
  enabled: true

logging:
  level: "INFO"
  structured: true
