# YOLO speech-bubble detector (ogkalu) + EasyOCR + M2M100
# python scripts/download_comic_yolo.py --variant bubble

pipeline:
  version: "0.1.0"
  source_language: "en"
  target_language: "fa"
  force: true

preprocessing:
  convert_to_rgb: true
  max_dimension: 1600
  validate: true

detection:
  backend: "yolo_comic"
  model: "models/comic-bubble.pt"
  variant: "bubble"
  confidence_threshold: 0.25
  imgsz: 1024

ocr:
  backend: "easyocr"
  languages: ["en"]
  confidence_threshold: 0.3

translation:
  backend: "huggingface"
  model: "models/m2m100-en2fa"
  batch_size: 4
  max_length: 256

masking:
  dilation_px: 8
  blur_radius: 1
  use_polygon: true

inpainting:
  backend: "opencv"
  fallback_to_cpu: true

device:
  preferred: "cuda"
  device_id: 0
  unload_after_stage: true

cache:
  enabled: true

logging:
  level: "INFO"
  structured: true
